[project]
name = "rl-core"
version = "1.0.0"
description = "Reproducible experiments and benchmarks for reinforcement-learning research"
authors = [
    {name = "eoinmcallister",email = "eoinmc.james@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
keywords = [
    "reinforcement-learning",
    "reproducibility",
    "benchmarking",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.15",
]

[project.urls]
Repository = "https://github.com/graylayer-labs/rl-core"
Issues = "https://github.com/graylayer-labs/rl-core/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.8"
ty = "^0.0.26"
pytest = "^9.0.2"

[tool.poetry.group.atari.dependencies]
# Kept optional because ALE ROMs and emulator dependencies are only needed for
# Atari reproductions, not for the core library or its unit tests.
gymnasium = {version = "==1.2.3", extras = ["atari", "accept-rom-license"]}
ale-py = "==0.11.2"
opencv-python-headless = "==4.13.0.92"
