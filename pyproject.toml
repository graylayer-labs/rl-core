[project]
name = "rl-core"
version = "1.0.0"
description = "Reproducible experiments and benchmarks for reinforcement-learning research"
authors = [
    {name = "eoinmcallister",email = "eoinmc.james@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "reinforcement-learning",
    "reproducibility",
    "benchmarking",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.15",
]

[project.urls]
Repository = "https://github.com/graylayer-labs/rl-core"
Issues = "https://github.com/graylayer-labs/rl-core/issues"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.8"
ty = "^0.0.26"
pytest = "^9.0.2"
